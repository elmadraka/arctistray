name: Build and Release ArctisTray

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean ArctisTray.spec

      - name: Verify executable
        run: |
          if (!(Test-Path "dist/ArctisTray.exe")) {
            throw "ArctisTray.exe was not generated"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArctisTray.exe
          generate_release_notes: true